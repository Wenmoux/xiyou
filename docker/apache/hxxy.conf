# ============================================================
# 幻想西游一键端 - Apache 虚拟主机
# 覆盖官方镜像自带的 /etc/apache2/sites-available/000-default.conf
# 对应原端 phpstudy/Apache/conf/httpd.conf 的 DocumentRoot
# ============================================================

ServerName localhost

# 该端代码是单线程同步模型，且历史上存在跨站 curl 自请求，
# 限制单进程处理的请求数，避免某个卡住的请求长期占着 worker。
<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers      150
    # 每个子进程处理满 1000 个请求后回收，防止内存/状态累积
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/hxxy
    DirectoryIndex index.php index.html index.htm

    <Directory /var/www/hxxy>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # 运行期 .ini 缓存 / 备份文件不应被直接下载
        <FilesMatch "\.(ini|log|md|bak|chm|tar|gz|zip)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/hxxy/fqxy>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 7 days"
        ExpiresByType image/jpeg "access plus 7 days"
        ExpiresByType image/gif "access plus 7 days"
        ExpiresByType text/css "access plus 1 day"
        ExpiresByType application/javascript "access plus 1 day"
    </IfModule>
</VirtualHost>

AddDefaultCharset Off
