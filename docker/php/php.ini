; 幻想西游一键端 - PHP 运行配置
; 对应原端 phpstudy/php55n/php.ini 的关键项，按容器环境调整

; ---------- 旧代码兼容 ----------
; 全站 1586 个文件用 <? 短标签开头，必须开启
short_open_tag = On

; ---------- 错误显示 ----------
; 原端 display_errors=Off，但页面靠 error_reporting 屏蔽 notice；
; 容器里保留 Off，避免破坏版面（旧代码大量未定义变量）
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; ---------- 字符集 ----------
; 页面声明 UTF-8，数据库表 utf8；部分脚本已显式 mysql_query("set names utf8")
default_charset = "UTF-8"

; ---------- 上传/内存 ----------
upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; ---------- 时区 ----------
date.timezone = Asia/Shanghai

; ---------- 会话 ----------
session.gc_maxlifetime = 86400

; ---------- 安全（容器内收敛） ----------
expose_php = Off
allow_url_include = Off
